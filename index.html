<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sufyan Mart - Sheet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sufyan Mart</h1>
  </header>

  <main>
    <table id="sheet">
      <thead>
        <tr>
          <th>Item</th>
          <th>Quantity</th>
          <th>Price</th>
          <th>Line</th>
          <th>Note</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
          <div id="summary">
      <p id="total"></p>
      <p id="totalKind"></p>
      <p id="noteKind"></p>
      <p id="priceMatch"></p>
      <p id="sameKind"></p>
      <p id="lineKind"></p>
    </div>
    </table>

    <form id="addForm" onsubmit="return false;">
      <label>Item <input type="text" id="item"></label>
      <label>Quantity <input type="text" id="quantity"></label>
      <label>Price <input type="text" id="price"></label>
      <button type="button" id="addBtn">Add</button>
          <p><a href="till.html">Go to the till</a></p>
              <p><a href="people.html">Who is in the shop</a></p>
    </form>
  </main>

  <footer>
    Roll: 247237
  </footer>

  <script src="script.js"></script>
</body>
</html>
